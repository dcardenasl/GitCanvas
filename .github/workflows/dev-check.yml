name: dev-check

# Fast feedback on `dev`, and nothing more.
#
# `dev` is where work lands quickly, so this job only runs what finishes in
# about a minute: types, lint, the frontend tests and the git engine tests, on
# one operating system. Everything expensive — the three-OS matrix, clippy with
# -D warnings, the bindings drift check and the release build — lives in
# quality.yml and runs once, when a pull request into `main` is proposed.

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: dev-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the Rust toolchain
        run: python scripts/install-rust-toolchain.py

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # The git engine needs none of Tauri's webview libraries, so this job does
      # not install them. It does need D-Bus: on Linux the keychain backend
      # talks to the Secret Service over it.
      - name: Install the keychain dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - run: npm ci

      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run typecheck:node
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

      - name: Test the git engine
        run: cargo test -p gitcanvas-core
