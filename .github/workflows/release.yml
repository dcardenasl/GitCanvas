name: release

# On a `v*.*.*` tag push, extract the matching section from CHANGELOG.md,
# create a GitHub Release with those notes, and attach an installer for each
# operating system.
#
# Release tags must point to commits already merged into `main`. The version
# must match all application manifests and have a section in CHANGELOG.md.
#
# Code signing is deliberately out of scope for now. The bundle step is where
# it will go: adding the signing secrets to that job is the whole change, with
# no restructuring of this workflow.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate tag ancestry and release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_REF: ${{ github.ref }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_SHA="$(git rev-parse "${TAG_REF}^{commit}")"
          if ! git merge-base --is-ancestor "${TAG_SHA}" refs/remotes/origin/main; then
            echo "::error::${RELEASE_TAG} does not point to a commit reachable from main."
            exit 1
          fi
          python scripts/validate-release.py "${RELEASE_TAG}"

  create-release:
    needs: validate-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.notes.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found in repo root."
            exit 1
          fi

          # Pull the body between `## [VERSION]` and the next `## [`,
          # excluding the heading line itself.
          NOTES=$(awk -v heading="## [${VERSION}]" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if ($0 == heading) { capture = 1; next }
            }
            capture { print }
          ' CHANGELOG.md)

          if [ -z "${NOTES}" ]; then
            echo "::error::No CHANGELOG section found for version ${VERSION}. Did you forget to rename [Unreleased] before tagging?"
            exit 1
          fi

          delimiter="$(python -c 'import uuid; print("RELEASE_NOTES_" + uuid.uuid4().hex)')"
          {
            echo "notes<<${delimiter}"
            printf '%s\n' "${NOTES}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          # Write notes to a file to avoid shell injection from CHANGELOG content.
          printf '%s' "${RELEASE_NOTES}" > "${RUNNER_TEMP}/release-notes.md"

          # Draft until every installer has been attached, so nobody downloads
          # a release that is missing their platform.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; updating notes."
            gh release edit "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md" --draft
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --draft
          fi

          RELEASE_ID=$(gh release view "${GITHUB_REF_NAME}" --json databaseId --jq .databaseId)
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  bundle:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-latest
            target: ""
            args: ""
          - os: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the Rust toolchain
        run: python scripts/install-rust-toolchain.py ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.os }}-${{ matrix.args }}

      - name: Install the Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libdbus-1-dev \
            pkg-config \
            rpm

      - run: npm ci

      - name: Build and attach the installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, bundle]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
