version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      # One WebdriverIO major at a time: @wdio/tauri-service peers on
      # webdriverio ^9, so a lone v10 bump of any @wdio package splits the tree.
      wdio:
        patterns: ["@wdio/*", "webdriverio"]
    ignore:
      # Types must match the Node runtime in `engines` and CI (22), not the latest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
