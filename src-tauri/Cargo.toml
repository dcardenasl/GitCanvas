[package]
name = "gitcanvas"
description = "Visual Git client focused on the branch and commit graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitcanvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true

# The git domain. This layer only translates between IPC and core.
gitcanvas-core = { path = "../crates/gitcanvas-core" }

specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true

[dev-dependencies]
git2.workspace = true
tempfile = "3"
# The `test` feature unlocks tauri::test, which builds a headless app and
# dispatches real IPC requests through it. That is what lets the round trip be
# verified in CI instead of only by looking at a window.
tauri = { version = "2", features = ["test"] }

[lints]
workspace = true
