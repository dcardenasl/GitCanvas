  <circle cx="306" cy="156" r="5" fill="#c4a3ff"/>
  <circle cx="306" cy="236" r="5" fill="#c4a3ff"/>
  <circle cx="348" cy="311" r="5" fill="#74c7ec"/>
  <circle cx="306" cy="411" r="6" fill="#c4a3ff"/>
  <circle cx="306" cy="488" r="5" fill="#c4a3ff"/>
