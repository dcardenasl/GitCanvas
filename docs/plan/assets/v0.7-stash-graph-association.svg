<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc">
  <title id="title">Stash markers in the commit graph</title>
  <desc id="desc">Two unique stash objects are grouped on their loaded base commit row. An anchored popover lists aliases, messages, and dates. The graph has no stash connector.</desc>
